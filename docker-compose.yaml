services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCODE_VERSION: 1.18.16
    mem_limit: 4g
    cpus: "3"
    environment:
      - NODE_NO_WARNINGS=1
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?error}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:?error}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY:-}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WAKATIME_API_KEY=${WAKATIME_API_KEY:-}
      - WAKATIME_HOME=/home/opencode/.local/share/wakatime
    volumes:
      - opencode-home:/home/opencode
      - opencode-workspace:/home/opencode/workspace
    tmpfs:
      - /tmp
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - 4096:4096
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -u \"${OPENCODE_SERVER_USERNAME:-opencode}:${OPENCODE_SERVER_PASSWORD}\" http://localhost:4096/api/health | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  opencode-home:
  opencode-workspace:
