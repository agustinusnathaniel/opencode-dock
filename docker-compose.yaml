services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Single version source per tool: Dockerfile ARG defaults are the
        # fallback, so leaving an env unset still builds.
        # OPENCODE_VERSION is pinned (not `latest`): the base image's `latest`
        # tag has pointed at v1 (observed 1.19.6), and a v2-only config
        # crash-loops a v1 binary. Other tools resolve npm `latest` (smoke
        # test guards them) and may safely float.
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.7}
        PNPM_VERSION: ${PNPM_VERSION:-12.21.0}
        YARN_VERSION: ${YARN_VERSION:-4.18.1}
        RTK_VERSION: ${RTK_VERSION:-v1.2.0}
        CODEGRAPH_VERSION: ${CODEGRAPH_VERSION:-latest}
        TOKSCALE_VERSION: ${TOKSCALE_VERSION:-latest}
        WAKATIME_VERSION: ${WAKATIME_VERSION:-latest}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    mem_limit: 4g
    cpus: "3"
    environment:
      - NODE_NO_WARNINGS=1
      # v2 canonical password (username is always `opencode`; there is no
      # OPENCODE_SERVER_USERNAME in v2).
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:?error}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY:-}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WAKATIME_API_KEY=${WAKATIME_API_KEY:-}
      # Long-lived Claude Code OAuth token for "Connect Claude Agent" (headless
      # servers can't do the browser login). Generate on a machine with a
      # browser: `claude setup-token`. Billed to your Claude plan.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - opencode-home:/home/opencode
      - opencode-workspace:/home/opencode/workspace
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      # Loopback by default: Docker bypasses UFW.
      - ${OPENCODE_BIND:-127.0.0.1}:4096:4096
    healthcheck:
      # v1 serves /api/health; v2 removed it (404) and serves /api/info (200
      # when authenticated). Probe info first, then health, so the check is
      # correct on either major (a version-pinned rebuild should land on v2,
      # but a floating tag must never report healthy/unhealthy for the wrong
      # reason). $$ escapes to a literal $ for the in-container shell.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -u \"opencode:$$OPENCODE_PASSWORD\" http://localhost:4096/api/info | grep -q 200 || curl -s -o /dev/null -w '%{http_code}' -u \"opencode:$$OPENCODE_PASSWORD\" http://localhost:4096/api/health | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  opencode-home:
  opencode-workspace:
