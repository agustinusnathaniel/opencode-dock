services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Single version source (Dockerfile default is a fallback only).
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.7}
    mem_limit: 4g
    cpus: "3"
    environment:
      - NODE_NO_WARNINGS=1
      # v2 canonical password (username is always `opencode`; there is no
      # OPENCODE_SERVER_USERNAME in v2).
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:?error}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY:-}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WAKATIME_API_KEY=${WAKATIME_API_KEY:-}
    volumes:
      - opencode-home:/home/opencode
      - opencode-workspace:/home/opencode/workspace
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - 4096:4096
    healthcheck:
      # v2 removed /api/health (404); /api/info returns 200 when authenticated.
      # $$ escapes to a literal $ for the in-container shell fallback.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -u \"opencode:$$OPENCODE_PASSWORD\" http://localhost:4096/api/info | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  opencode-home:
  opencode-workspace:
