services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Single version source per tool: Dockerfile ARG defaults are the
        # fallback, so leaving an env unset still builds the known-good image.
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.7}
        PNPM_VERSION: ${PNPM_VERSION:-12.19.0}
        YARN_VERSION: ${YARN_VERSION:-4.18.1}
        RTK_VERSION: ${RTK_VERSION:-v1.2.0}
        CODEGRAPH_VERSION: ${CODEGRAPH_VERSION:-1.6.2}
        TOKSCALE_VERSION: ${TOKSCALE_VERSION:-4.21.0}
        WAKATIME_VERSION: ${WAKATIME_VERSION:-1.4.0}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.322}
    mem_limit: 4g
    cpus: "3"
    environment:
      - NODE_NO_WARNINGS=1
      # v2 canonical password (username is always `opencode`; there is no
      # OPENCODE_SERVER_USERNAME in v2).
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:?error}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY:-}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WAKATIME_API_KEY=${WAKATIME_API_KEY:-}
      # Long-lived Claude Code OAuth token for "Connect Claude Agent" (headless
      # servers can't do the browser login). Generate on a machine with a
      # browser: `claude setup-token`. Billed to your Claude plan.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - opencode-home:/home/opencode
      - opencode-workspace:/home/opencode/workspace
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - 4096:4096
    healthcheck:
      # v2 removed /api/health (404); /api/info returns 200 when authenticated.
      # $$ escapes to a literal $ for the in-container shell fallback.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -u \"opencode:$$OPENCODE_PASSWORD\" http://localhost:4096/api/info | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  opencode-home:
  opencode-workspace:
