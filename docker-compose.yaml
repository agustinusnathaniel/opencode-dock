services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCODE_VERSION: 1.17.13
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?error}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:?error}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    volumes:
      - opencode-data:/home/opencode/.local/share/opencode
      - opencode-config:/home/opencode/.config/opencode
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    restart: unless-stopped
    ports:
      - 4096:4096
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/global/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  opencode-data:
  opencode-config:
